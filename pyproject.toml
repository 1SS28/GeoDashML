[project]
name = "gdml"
version = "0.1.0"
description = "GeoDashML: reinforcement learning on Geometry Dash through a lockstep Geode bridge"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2",
    "pandas>=2",
    "torch>=2.14.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdbridge", "gdenv", "gdsearch", "gdrl"]
